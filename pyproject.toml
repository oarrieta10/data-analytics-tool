[project]
name = "gtpfit"
version = "0.1.0"
description = "Data-driven goods-to-person technology fit studies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyyaml>=6", "duckdb>=1.1", "openpyxl>=3.1",
                "python-calamine>=0.3", "xlrd>=2.0", "pyxlsb>=1.0", "charset-normalizer>=3.0", "pyarrow>=14", "tzdata",
                "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
