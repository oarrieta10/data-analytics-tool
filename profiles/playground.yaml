# Scratch profile for experimenting. Uncomment and change anything; the rest
# keeps the defaults in src/gtpfit/synth/config.py (unknown keys are rejected).
name: playground
seed: 1
# start_date: "2025-01-01"
# days: 365

# --- catalogue ---
n_skus: 25000
# share_inventory_only: 0.06     # dead stock: stocked, never ordered
# share_new_in_year: 0.12
# share_discontinued: 0.08
# popularity_sigma: 1.75         # higher = more skewed (fewer, bigger A items)

# --- e-commerce ---
ecom_orders_per_day: 500
# ecom_single_line_share: 0.55
# ecom_single_unit_share: 0.82
# ecom_extra_units_geom_p: 0.6   # lower = more units on multi-unit lines

# --- store / B2B replenishment (weekdays only) ---
b2b_orders_per_day: 15
# b2b_lines_mean: 22
# b2b_full_case_share: 0.5
# b2b_full_case_multiple_geom_p: 0.6
# b2b_volume_cap: 1.3            # store orders don't follow e-com promos past this

# --- calendar / peaks ---
# weekday_factors: [1.15, 1.10, 1.05, 1.00, 0.95, 0.70, 0.50]   # Mon..Sun
# q4_ramp: 0.35                  # December uplift vs base
# promo_days: {black_friday: 2.6, cyber_monday: 2.3, mid_july_sale: 1.8}
# daily_noise_cv: 0.08

# --- peak-day basket shape (e-commerce) ---
# Off by default: baskets look the same every day. Set a value to change it on
# event days (lift = season x promo); it applies fully at reference_lift.
# Example below = bigger baskets on peaks; the other side of normal = smaller.
# peak_shape:
#   reference_lift: 2.0
#   max_t: 1.0                   # >1 lets bigger events (Black Friday ~3.5x) go further
#   ecom_single_line_share: 0.45
#   ecom_multi_line_geom_p: 0.42
#   ecom_single_unit_share: 0.75
#   ecom_extra_units_geom_p: 0.50

# --- inventory policy ---
# cover_days: {A: 14, B: 30, C: 45, D: 60}
# lead_time_days: [5, 21]
# safety_factor: 1.3

# --- planted data problems (share of SKUs or rows) ---
# truncate_orders_at_excel_limit: false
defects:
  missing_dims: 0.06
  placeholder_001: 0.05
  # missing_weight: 0.04
  # missing_case_qty: 0.03
  # placeholder_111: 0.02
  # metric_dims: 0.02            # cm typed into inch fields
  # weight_in_oz: 0.02
  # decimal_shift: 0.01
  # case_qty_default_1: 0.03
  # case_smaller_than_unit: 0.01
  # duplicate_sku_rows: 0.005
  # orphan_skus: 0.02
  # sku_format_variants: 0.005
  # zero_or_negative_qty: 0.002
  # duplicate_order_rows: 0.001
  # missing_pick_time: 0.005
