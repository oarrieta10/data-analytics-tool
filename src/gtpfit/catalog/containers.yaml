# Container catalogue: the storage containers the design stage fits SKUs into.  Specs only, no client data.
#
# Each container:
#   id, name, system, supplier, status
#   mode        units        loose units packed into the container (and its divider cells)
#               case_on_tray one carton per tray; carton_range gives the cartons the tray takes
#   inside      inside length / width / height, with unit (mm, cm or in); for a tapered (nestable) tote the
#               bottom inside size, the narrowest, which is what fitting uses
#   inside_top  optional; the opening of a tapered tote (recorded, not fitted)
#   tare        the container's own weight
#   payload     what it carries, with unit (kg or lb); confidence: low marks a placeholder
#   gross_limit instead of payload: the limit on container + goods; the payload is gross_limit less tare
#   dividers    cell layouts besides the whole container: {name, cells, l_split, w_split}
#   cell_utilisation  optional; share of a cell's volume usable by liquid cube (FitParams default otherwise)
#   source, confidence  where the specs come from and how sure they are
#
# HaiPick Climb (HPC) only for now, and only the totes HAI lists as available for sale.  Still to add: the HaiPick
# System 3 totes, the mould-pending 650 x 450 and 600 x 400 stackable and folding totes, custom heights, and
# competitor containers (AutoStore and others).  No dividers on HAI totes.

containers:
  - id: hpc_folding_tote_650x450x300
    name: Folding tote 650 × 450 × 300
    system: HaiPick Climb
    supplier: HAI Robotics
    status: moulded, available for sale
    mode: units
    inside: {l: 616, w: 420, h: 286, unit: mm}
    tare: {value: 3.05, unit: kg}
    gross_limit: {value: 30, unit: kg}
    dividers: []
    source: HAI tote specification sheet, standard configuration (received 2026-10-29)
    confidence: high

  - id: hpc_tray_650x450x70
    name: Carton tray 650 × 450 × 70
    system: HaiPick Climb
    supplier: HAI Robotics
    status: moulded, available for sale
    mode: case_on_tray
    inside: {l: 620, w: 426, h: 30, unit: mm}
    tray_thickness: {value: 40, unit: mm}
    carton_range: {l: [200, 600], w: [200, 400], h: [50, 460], unit: mm}
    tare: {value: 2.25, unit: kg}
    gross_limit: {value: 30, unit: kg}
    dividers: []
    source: HAI tote specification sheet, standard configuration (received 2026-10-29)
    confidence: high

  - id: hpc_nestable_tote_650x450x300
    name: Nestable tote 650 × 450 × 300
