    inside_top: {l: 606, w: 412, unit: mm}
    tare: {value: 2.22, unit: kg}
    gross_limit: {value: 30, unit: kg}
    dividers: []
    source: HAI tote specification sheet, optional configuration (received 2026-10-29)
    confidence: high

  - id: hpc_nestable_tote_600x400x300
    name: Nestable tote 600 × 400 × 300
